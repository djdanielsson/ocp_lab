---
apiVersion: apme.ansible.com/v1alpha1
kind: Apme
metadata:
  name: apme-dev
  namespace: apme-dev
  labels:
    app.kubernetes.io/name: apme
    app.kubernetes.io/managed-by: apme-operator
spec:
  # Images built by Tekton (apps/apme/pipeline) into the apme-dev namespace.
  version: "latest"
  replicas: 1
  image:
    registry: image-registry.openshift-image-registry.svc:5000/apme-dev
    pullPolicy: Always
  components:
    gitleaks: true
    collectionHealth: true
    depAudit: true
    ui: true
  exposure:
    route:
      enabled: true
      host: apme-dev.apps.ocp.new.lab.danielsson.us.com
  storage:
    sessions:
      size: 5Gi
      storageClass: lvms-lvm-local-storage
    proxyCache:
      size: 5Gi
      storageClass: lvms-lvm-local-storage
  database:
    postgres:
      storage:
        size: 5Gi
        storageClass: lvms-lvm-local-storage
  abbenay:
    enabled: true
    image: ghcr.io/redhat-developer/abbenay:latest
    # Operator auto-generates apme-dev-abbenay (dashboard/gRPC auth token).
    # Provider API keys are added via the Abbenay UI, not here.
    persistence:
      enabled: true
      size: 1Gi
      storageClass: lvms-lvm-local-storage
