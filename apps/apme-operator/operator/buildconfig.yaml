---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: apme-operator
  namespace: apme
  labels:
    app.kubernetes.io/name: apme-operator
spec:
  runPolicy: Serial
  source:
    type: Git
    git:
      uri: https://github.com/djdanielsson/apme-operator.git
      ref: main
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: apme-operator:latest
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi
  # Manual / binary builds only. First image is typically:
  #   oc start-build apme-operator -n apme --from-dir=<apme-operator> --follow
  triggers: []
