---
apiVersion: apme.ansible.com/v1alpha1
kind: Apme
metadata:
  name: apme-op
  namespace: apme
  labels:
    app.kubernetes.io/name: apme
    app.kubernetes.io/managed-by: apme-operator
spec:
  # Released APME from Quay (not lab pipeline).
  version: "2026.8.9"
  replicas: 1
  image:
    registry: quay.io/ansible
    pullPolicy: IfNotPresent
  components:
    gitleaks: true
    collectionHealth: true
    depAudit: true
    ui: true
  exposure:
    route:
      enabled: true
      host: apme-operator.apps.ocp.new.lab.danielsson.us.com
  storage:
    sessions:
      size: 5Gi
      storageClass: lvms-lvm-local-storage
    proxyCache:
      size: 5Gi
      storageClass: lvms-lvm-local-storage
  database:
    postgres:
      storage:
        size: 5Gi
        storageClass: lvms-lvm-local-storage
  abbenay:
    enabled: false
