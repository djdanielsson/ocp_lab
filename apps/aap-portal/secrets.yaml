---
# AAP auth — OAuth app credentials + API token for portal ↔ AAP controller.
# These are always required: the portal uses them for user login (OAuth) and
# catalog sync (API token).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: secrets-rhaap-portal
  namespace: aap-portal
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: bitwarden-fields
    kind: ClusterSecretStore
  target:
    name: secrets-rhaap-portal
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        aap-host-url: "{{ .aaphosturl }}"
        oauth-client-id: "{{ .oauthclientid }}"
        oauth-client-secret: "{{ .oauthclientsecret }}"
        aap-token: "{{ .aaptoken }}"
        registry-username: "{{ .registryusername }}"
        registry-password: "{{ .registrypassword }}"
  data:
    - secretKey: aaphosturl
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: ocp-lab/aap-portal
        property: aap-host-url
    - secretKey: oauthclientid
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: ocp-lab/aap-portal
        property: oauth-client-id
    - secretKey: oauthclientsecret
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: ocp-lab/aap-portal
        property: oauth-client-secret
    - secretKey: aaptoken
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: ocp-lab/aap-portal
        property: aap-token
    - secretKey: registryusername
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: ocp-lab/aap-portal
        property: registry-username
    - secretKey: registrypassword
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: ocp-lab/aap-portal
        property: registry-password
---
# PostgreSQL credentials for the embedded database.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: redhat-rhaap-portal-postgresql-creds
  namespace: aap-portal
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: bitwarden-fields
    kind: ClusterSecretStore
  target:
    name: redhat-rhaap-portal-postgresql-creds
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        password: "{{ .pgpassword }}"
        postgres-password: "{{ .pgpassword }}"
  data:
    - secretKey: pgpassword
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: ocp-lab/aap-portal
        property: pg-password
---
# OCI plugin registry auth — required for pluginMode: oci.
# The install-dynamic-plugins init container uses skopeo to pull plugins
# from registry.redhat.io and does NOT use cluster pull secrets or
# imagePullSecrets. This dedicated secret is the only way it authenticates.
#
# Credentials come from the documented registry-username and registry-password
# fields in the Vaultwarden ocp-lab/aap-portal item.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pull-secret-sync
  namespace: aap-portal
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pull-secret-sync-writer
  namespace: aap-portal
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["secrets-rhaap-portal"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["redhat-rhaap-portal-dynamic-plugins-registry-auth"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pull-secret-sync-writer
  namespace: aap-portal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pull-secret-sync-writer
subjects:
  - kind: ServiceAccount
    name: pull-secret-sync
    namespace: aap-portal
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pull-secret-sync
  namespace: aap-portal
spec:
  schedule: "0 */6 * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: pull-secret-sync
          restartPolicy: OnFailure
          containers:
            - name: sync
              image: registry.redhat.io/openshift4/ose-cli:latest
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  REGISTRY_USERNAME=$(oc get secret secrets-rhaap-portal -n aap-portal -o jsonpath='{.data.registry-username}' | base64 -d)
                  REGISTRY_PASSWORD=$(oc get secret secrets-rhaap-portal -n aap-portal -o jsonpath='{.data.registry-password}' | base64 -d)
                  AUTH=$(printf '%s:%s' "$REGISTRY_USERNAME" "$REGISTRY_PASSWORD" | base64 -w0)
                  AUTH_JSON=$(printf '{"auths":{"registry.redhat.io":{"auth":"%s"}}}' "$AUTH")
                  oc apply -f - <<EOF
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: redhat-rhaap-portal-dynamic-plugins-registry-auth
                    namespace: aap-portal
                  type: Opaque
                  stringData:
                    auth.json: '$AUTH_JSON'
                  EOF
                  echo "Synced registry auth from the portal ExternalSecret"
