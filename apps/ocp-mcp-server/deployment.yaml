---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocp-mcp-server
  namespace: ocp-mcp-server
  labels:
    app: ocp-mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ocp-mcp-server
  template:
    metadata:
      labels:
        app: ocp-mcp-server
    spec:
      serviceAccountName: ocp-mcp-server
      volumes:
        - name: config
          configMap:
            name: ocp-mcp-server-config
      containers:
        - name: ocp-mcp-server
          image: ghcr.io/containers/kubernetes-mcp-server:latest
          args:
            - --config
            - /etc/kubernetes-mcp-server/config.toml
          ports:
            - containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/kubernetes-mcp-server
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
