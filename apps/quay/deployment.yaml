---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quay-ephemeral
  namespace: quay-ephemeral
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quay-ephemeral
  template:
    metadata:
      labels:
        app: quay-ephemeral
    spec:
      containers:
        # --- QUAY CONTAINER ---
        - name: quay
          image: quay.io/projectquay/quay:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Waiting for Postgres..."
              # Wait loop
              while ! python3 -c "import socket; s=socket.socket(socket.AF_INET, socket.SOCK_STREAM); result=s.connect_ex(('localhost', 5432)); exit(result)"; do
                sleep 2
              done
              echo "Postgres is UP! Starting Quay..."
              /quay-registry/quay-entrypoint.sh
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /conf/stack
            - name: storage
              mountPath: /datastorage
          readinessProbe:
            httpGet:
              path: /health/instance
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10

        # --- REDIS SIDECAR ---
        - name: redis
          image: quay.io/sclorg/redis-6-c9s:latest
          ports:
            - containerPort: 6379

        # --- POSTGRES SIDECAR ---
        - name: postgres
          image: quay.io/sclorg/postgresql-13-c9s:latest
          env:
            - name: POSTGRESQL_USER
              value: "quay"
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: quay-postgres
                  key: POSTGRESQL_PASSWORD
            - name: POSTGRESQL_DATABASE
              value: "quay"
            - name: POSTGRESQL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: quay-postgres
                  key: POSTGRESQL_ADMIN_PASSWORD
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/pgsql/data
            - name: db-init
              mountPath: /usr/share/container-scripts/postgresql/start/init_extension.sh
              subPath: init_extension.sh

      # --- VOLUMES SECTION (Critical Fix) ---
      volumes:
        - name: config
          emptyDir: {}
        - name: db-init
          configMap:
            name: postgres-init
            defaultMode: 493
        - name: storage
          emptyDir: {}
        - name: db-data
          emptyDir: {}
        - name: base-config
          secret:
            secretName: quay-config
        - name: sso-script
          configMap:
            name: quay-sso
        - name: sso-credentials
          secret:
            secretName: quay-sso-client

      initContainers:
        - name: configure-sso
          image: registry.access.redhat.com/ubi9/python-312:latest@sha256:5b184c2acfe9e2eb9df1a243da8e4a82fedd96e5e7f6648ec5512656177fa326
          command:
            - python3
            - /sso/configure-sso.py
          volumeMounts:
            - name: base-config
              mountPath: /source
              readOnly: true
            - name: config
              mountPath: /rendered
            - name: sso-script
              mountPath: /sso
              readOnly: true
            - name: sso-credentials
              mountPath: /credentials
              readOnly: true
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: quay-ephemeral
  namespace: quay-ephemeral
spec:
  selector:
    app: quay-ephemeral
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
