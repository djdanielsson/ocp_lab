---
kind: Grafana
apiVersion: grafana.integreatly.org/v1beta1
metadata:
  labels:
    dashboards: grafana
    folders: grafana
  name: grafana
spec:
  config:
    auth:
      disable_login_form: 'false'
    server:
      root_url: https://grafana-monitoring.apps.ocp.lab.danielsson.us.com
    auth.generic_oauth:
      enabled: 'true'
      name: Lab SSO
      allow_sign_up: 'true'
      client_id: grafana
      scopes: openid profile email
      auth_url: https://sso.apps.ocp.lab.danielsson.us.com/realms/lab/protocol/openid-connect/auth
      token_url: https://sso.apps.ocp.lab.danielsson.us.com/realms/lab/protocol/openid-connect/token
      api_url: https://sso.apps.ocp.lab.danielsson.us.com/realms/lab/protocol/openid-connect/userinfo
      use_pkce: 'true'
      role_attribute_path: "contains(groups[*], 'lab-admins') && 'Admin' || contains(groups[*], 'lab-users') && 'Viewer'"
      role_attribute_strict: 'true'
      allow_assign_grafana_admin: 'false'
    log:
      mode: console
  # ingress:
  #   spec:
  #     rules:
  #       - host: grafana-monitoring.apps.ocp.lab.danielsson.us.com
  #         http:
  #           paths:
  #             - path: /
  #               pathType: Prefix
  #               backend:
  #                 service:
  #                   name: grafana-service
  #                   port:
  #                     number: 3000
  deployment:
    spec:
      template:
        spec:
          containers:
            - name: grafana
              env:
                - name: GF_SECURITY_ADMIN_USER
                  valueFrom:
                    secretKeyRef:
                      name: grafana-admin-vaultwarden
                      key: GF_SECURITY_ADMIN_USER
                - name: GF_SECURITY_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grafana-admin-vaultwarden
                      key: GF_SECURITY_ADMIN_PASSWORD
                - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: sso-oidc
                      key: client-secret
