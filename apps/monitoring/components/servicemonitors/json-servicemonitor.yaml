---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: json-exporter
  labels:
    # k8s-app: json-exporter
    # app: json-exporter
    team: frontend
    # release: prometheus-k8s
spec:
  endpoints:
  - interval: 5s
    port: http
    path: /probe
    params:
      target: ["http://aap.aap.svc.cluster.local/api/gateway/v1/status/?format=json"]
      module:
      - default
    relabelings:
      - targetLabel: module
        replacement: default
  # Detailed Hub status is no longer embedded in the gateway response.
  - interval: 15s
    port: http
    path: /probe
    params:
      target: ["http://aap-hub-api-svc.aap.svc.cluster.local:8000/api/galaxy/pulp/api/v3/status/"]
      module:
      - hub
    relabelings:
      - targetLabel: module
        replacement: hub
  namespaceSelector:
    matchNames:
      - aap
  selector:
    matchLabels:
      app: json-exporter
