---
apiVersion: v1
kind: ConfigMap
metadata:
  name: json-exporter-config
  labels:
    app: json-exporter
data:
  # Gateway status contains summary health only; obtain Hub details directly.
  config.yml: |
    modules:
      default:
        http_client_config:
          tls_config:
            insecure_skip_verify: true
          basic_auth:
            username: admin
            password_file: /etc/json-exporter/secrets/admin-password
        metrics:
        - name: aap_overall_status
          type: object
          help: Overall status of the AAP deployment.
          path: '{ $ }'
          labels:
            status: '{.status}'
          values:
            value: 1
        - name: aap_service_status
          type: object
          help: Status of individual AAP services.
          path: '{.services[*]}'
          labels:
            service: '{.service_name}'
            status: '{.status}'
          values:
            value: 1
        - name: aap_service_node_status
          type: object
          help: Status of individual AAP service nodes.
          path: '{.services[?(@.service_name=="controller")].nodes.*}'
          labels:
            service: controller
            node: '{.url}'
            status: '{.status}'
          values:
            value: 1
        - name: aap_service_node_status
          type: object
          help: Status of individual AAP service nodes.
          path: '{.services[?(@.service_name=="hub")].nodes.*}'
          labels:
            service: hub
            node: '{.url}'
            status: '{.status}'
          values:
            value: 1
        - name: aap_service_node_status
          type: object
          help: Status of individual AAP service nodes.
          path: '{.services[?(@.service_name=="eda")].nodes.*}'
          labels:
            service: eda
            node: '{.url}'
            status: '{.status}'
          values:
            value: 1
        - name: aap_redis_status
          type: object
          help: Redis health, mode, and ping result for standalone or clustered Redis.
          path: '{.services[?(@.service_name=="redis")].response}'
          labels:
            status: '{.status}'
            mode: '{.mode}'
            ping: '{.ping}'
          values:
            value: 1
      hub:
        http_client_config:
          tls_config:
            insecure_skip_verify: true
          basic_auth:
            username: admin
            password_file: /etc/json-exporter/secrets/admin-password
        metrics:
        - name: aap_hub_database_connection_status
          type: object
          help: Status of the hub''s database connection.
          path: '{ $ }'
          labels:
            connected: '{.database_connection.connected}'
          values:
            value: 1
        - name: aap_hub_redis_connection_status
          type: object
          help: Status of the hub''s redis connection.
          path: '{ $ }'
          labels:
            connected: '{.redis_connection.connected}'
          values:
            value: 1
        - name: aap_hub_component_info
          type: object
          help: Version information for hub components.
          path: '{.versions[*]}'
          labels:
            component: '{.component}'
            version: '{.version}'
            package: '{.package}'
          values:
            value: 1
        - name: aap_hub_online_worker_status
          type: object
          help: Status of online hub workers. Value is 1 if online.
          path: '{.online_workers[*]}'
          labels:
            worker_name: '{.name}'
          values:
            value: 1
        - name: aap_hub_online_api_app_status
          type: object
          help: Status of online hub API apps. Value is 1 if online.
          path: '{.online_api_apps[*]}'
          labels:
            api_app_name: '{.name}'
          values:
            value: 1
        - name: aap_hub_online_content_app_status
          type: object
          help: Status of online hub content apps. Value is 1 if online.
          path: '{.online_content_apps[*]}'
          labels:
            content_app_name: '{.name}'
          values:
            value: 1
