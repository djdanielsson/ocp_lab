---
# Per-database postgres_exporter sidecars using the shared monitoring user (pg_monitor).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporters
  labels:
    app: postgres-exporters
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-exporters
  template:
    metadata:
      labels:
        app: postgres-exporters
    spec:
      containers:
        - name: exporter-gateway
          image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
          args:
            - "--web.listen-address=:9186"
          ports:
            - containerPort: 9186
              name: metrics-gateway
          env:
            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  name: monitoring-postgres-credentials
                  key: host
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: monitoring-postgres-credentials
                  key: port
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: monitoring-postgres-credentials
                  key: username
            - name: PG_PASS
              valueFrom:
                secretKeyRef:
                  name: monitoring-postgres-credentials
                  key: password
            - name: DATA_SOURCE_NAME
              value: "postgresql://$(PG_USER):$(PG_PASS)@$(PG_HOST):$(PG_PORT)/automationgateway?sslmode=disable"

        - name: exporter-controller
          image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
          args:
            - "--web.listen-address=:9187"
          ports:
            - containerPort: 9187
              name: metrics-ctrl
          env:
            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  name: monitoring-postgres-credentials
                  key: host
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: monitoring-postgres-credentials
                  key: port
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: monitoring-postgres-credentials
                  key: username
            - name: PG_PASS
              valueFrom:
                secretKeyRef:
                  name: monitoring-postgres-credentials
                  key: password
            - name: DATA_SOURCE_NAME
              value: "postgresql://$(PG_USER):$(PG_PASS)@$(PG_HOST):$(PG_PORT)/automationcontroller?sslmode=disable"

        - name: exporter-hub
          image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
          args:
            - "--web.listen-address=:9188"
          ports:
            - containerPort: 9188
              name: metrics-hub
          env:
            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  name: monitoring-postgres-credentials
                  key: host
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: monitoring-postgres-credentials
                  key: port
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: monitoring-postgres-credentials
                  key: username
            - name: PG_PASS
              valueFrom:
                secretKeyRef:
                  name: monitoring-postgres-credentials
                  key: password
            - name: DATA_SOURCE_NAME
              value: "postgresql://$(PG_USER):$(PG_PASS)@$(PG_HOST):$(PG_PORT)/automationhub?sslmode=disable"

        - name: exporter-eda
          image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
          args:
            - "--web.listen-address=:9189"
          ports:
            - containerPort: 9189
              name: metrics-eda
          env:
            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  name: monitoring-postgres-credentials
                  key: host
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: monitoring-postgres-credentials
                  key: port
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: monitoring-postgres-credentials
                  key: username
            - name: PG_PASS
              valueFrom:
                secretKeyRef:
                  name: monitoring-postgres-credentials
                  key: password
            - name: DATA_SOURCE_NAME
              value: "postgresql://$(PG_USER):$(PG_PASS)@$(PG_HOST):$(PG_PORT)/automationeda?sslmode=disable"
