---
# CNPG exposes metrics on pod port 9187; cluster Services only expose 5432.
apiVersion: v1
kind: Service
metadata:
  name: aap-postgres-metrics
  labels:
    cnpg.io/cluster: aap-postgres
spec:
  selector:
    cnpg.io/cluster: aap-postgres
    cnpg.io/podRole: instance
  ports:
    - name: metrics
      port: 9187
      targetPort: 9187
