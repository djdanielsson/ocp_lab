---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: monitoring-postgres-credentials
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: bitwarden-login
    kind: ClusterSecretStore
  target:
    name: monitoring-postgres-credentials
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        host: "aap-postgres-rw.aap.svc.cluster.local"
        port: "5432"
        username: "monitoring"
        password: "{{ .password }}"
  data:
    - secretKey: password
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: ClusterSecretStore
      remoteRef:
        key: ocp-lab/postgres-monitoring
        property: password
