apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: minio-sso-client
  namespace: loki
spec:
  length: 64
  digits: 16
  symbols: 0
  allowRepeat: true
  noUpper: false
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-sso-client
  namespace: loki
spec:
  refreshPolicy: CreatedOnce
  target:
    name: minio-sso-client
    creationPolicy: Orphan
    deletionPolicy: Retain
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: minio-sso-client
    rewrite:
    - regexp:
        source: password
        target: client-secret
