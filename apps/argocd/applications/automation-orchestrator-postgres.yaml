---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: automation-orchestrator-postgres
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/djdanielsson/ocp_lab.git
    path: apps/automation-orchestrator/postgres/
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: aap
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
