---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apme-stable
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/djdanielsson/ocp_lab.git
    path: apps/apme-operator/stable/
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: apme
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
