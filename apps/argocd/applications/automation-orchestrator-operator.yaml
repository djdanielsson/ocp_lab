---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: automation-orchestrator-operator
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  destination:
    namespace: automation-orchestrator
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://github.com/djdanielsson/ocp_lab.git
    path: apps/automation-orchestrator/operator/
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
