---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apme
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: https://github.com/ansible/apme.git
      targetRevision: main
      path: deploy/helm/apme
      helm:
        releaseName: apme
        apiVersions:
          - route.openshift.io/v1
        valueFiles:
          - $values/apps/apme/values.yaml
    - repoURL: https://github.com/djdanielsson/ocp_lab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: apme
  ignoreDifferences:
    # Upstream chart probes Abbenay with `node`, but v2026.8.5 has no Node binary.
    # apps/apme/fixes patches these to a shell TCP check on loopback.
    - group: apps
      kind: Deployment
      name: apme-engine
      jqPathExpressions:
        - .spec.template.spec.containers[] | select(.name=="abbenay") | .readinessProbe
        - .spec.template.spec.containers[] | select(.name=="abbenay") | .livenessProbe
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
