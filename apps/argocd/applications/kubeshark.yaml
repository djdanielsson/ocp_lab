apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubeshark
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  project: default
  source:
    repoURL: https://github.com/djdanielsson/ocp_lab.git
    path: apps/kubeshark
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: kubeshark
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - RespectIgnoreDifferences=true
    - ServerSideApply=true
  ignoreDifferences:
  - group: ''
    kind: Secret
    name: kubeshark-secret-default
    namespace: kubeshark
    jsonPointers:
    - /data/OIDC_CLIENT_ID
    - /data/OIDC_CLIENT_SECRET
    - /data/LICENSE
