---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: apme-build-trigger
  namespace: apme-dev
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: apme-builder
          restartPolicy: Never
          containers:
            - name: trigger
              image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail

                  cleanup_old_runs() {
                    local pipeline="$1"
                    echo "Cleaning up old PipelineRuns for ${pipeline}..."
                    OLD_RUNS=$(oc get pipelineruns -n apme-dev \
                      -l tekton.dev/pipeline="${pipeline}" \
                      -o jsonpath='{.items[*].metadata.name}' 2>/dev/null || true)
                    for run in $OLD_RUNS; do
                      echo "Deleting old PipelineRun: $run"
                      oc delete pipelinerun "$run" -n apme-dev --ignore-not-found=true 2>/dev/null || true
                    done
                  }

                  create_run() {
                    local pipeline="$1"
                    local run_name="${pipeline}-$(date +%Y%m%d-%H%M%S)"
                    cat <<YAML | oc apply -f -
                  apiVersion: tekton.dev/v1
                  kind: PipelineRun
                  metadata:
                    name: ${run_name}
                    namespace: apme-dev
                    labels:
                      tekton.dev/pipeline: ${pipeline}
                  spec:
                    pipelineRef:
                      name: ${pipeline}
                    taskRunTemplate:
                      serviceAccountName: apme-builder
                    workspaces:
                      - name: source
                        persistentVolumeClaim:
                          claimName: apme-build-workspace
                  YAML
                    echo "Created PipelineRun: ${run_name}"
                  }

                  cleanup_old_runs apme-build
                  cleanup_old_runs apme-operator-build
                  create_run apme-build
                  create_run apme-operator-build
