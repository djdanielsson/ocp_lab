---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: apme-probe-patcher
  namespace: apme
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: apme-probe-patcher
  namespace: apme
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: apme-probe-patcher
  namespace: apme
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: apme-probe-patcher
subjects:
  - kind: ServiceAccount
    name: apme-probe-patcher
    namespace: apme
