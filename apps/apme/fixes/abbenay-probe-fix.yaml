---
# Upstream apme v2026.8.x Helm chart probes Abbenay with `node -e`, but the
# ghcr.io/redhat-developer/abbenay:v2026.8.5 image ships a standalone binary
# without Node.js on PATH. Replace probes with a shell TCP check on loopback.
apiVersion: batch/v1
kind: Job
metadata:
  name: apme-abbenay-probe-fix
  namespace: apme
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: apme-probe-patcher
      restartPolicy: Never
      containers:
        - name: patch
          image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              if ! oc get deployment apme-engine -n apme >/dev/null 2>&1; then
                echo "apme-engine deployment not found; skipping probe patch"
                exit 0
              fi
              oc patch deployment apme-engine -n apme --type=strategic -p '
              spec:
                template:
                  spec:
                    containers:
                    - name: abbenay
                      readinessProbe:
                        exec:
                          command: ["sh", "-c", "echo > /dev/tcp/127.0.0.1/50057"]
                        initialDelaySeconds: 5
                        periodSeconds: 10
                        timeoutSeconds: 1
                        successThreshold: 1
                        failureThreshold: 3
                      livenessProbe:
                        exec:
                          command: ["sh", "-c", "echo > /dev/tcp/127.0.0.1/50057"]
                        initialDelaySeconds: 15
                        periodSeconds: 30
                        timeoutSeconds: 1
                        successThreshold: 1
                        failureThreshold: 3
              '
              echo "Patched abbenay probes on apme-engine"
