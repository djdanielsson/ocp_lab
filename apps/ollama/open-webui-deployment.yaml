---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: ollama
  labels:
    app: open-webui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:main
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: OLLAMA_BASE_URL
              value: http://ollama.ollama.svc.cluster.local:11434
            - name: WEBUI_SECRET_KEY
              value: changeme
            - name: HOME
              value: /tmp/open-webui-home
            - name: WEBUI_URL
              value: https://open-webui.apps.ocp.lab.danielsson.us.com
            - name: ENABLE_OAUTH_SIGNUP
              value: 'true'
            - name: OAUTH_PROVIDER_NAME
              value: Lab SSO
            - name: OPENID_PROVIDER_URL
              value: https://sso.apps.ocp.lab.danielsson.us.com/realms/lab/.well-known/openid-configuration
            - name: OAUTH_CLIENT_ID
              value: open-webui
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sso-oidc
                  key: client-secret
            - name: OPENID_REDIRECT_URI
              value: https://open-webui.apps.ocp.lab.danielsson.us.com/oauth/oidc/callback
            - name: OAUTH_CODE_CHALLENGE_METHOD
              value: S256
            - name: ENABLE_OAUTH_ROLE_MANAGEMENT
              value: 'true'
            - name: OAUTH_ROLES_CLAIM
              value: groups
            - name: OAUTH_ALLOWED_ROLES
              value: lab-users,lab-admins
            - name: OAUTH_ADMIN_ROLES
              value: lab-admins
            - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
              value: 'false'
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          emptyDir: {}
