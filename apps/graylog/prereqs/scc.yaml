---
apiVersion: v1
kind: Namespace
metadata:
  name: graylog
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: graylog-datanode-sa
  namespace: graylog
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ocp-lab-use-scc-graylog-runtime
rules:
  - apiGroups:
      - security.openshift.io
    resourceNames:
      - graylog-runtime
    resources:
      - securitycontextconstraints
    verbs:
      - use
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: graylog-runtime-scc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ocp-lab-use-scc-graylog-runtime
subjects:
  - kind: ServiceAccount
    name: graylog-sa
    namespace: graylog
  - kind: ServiceAccount
    name: graylog-datanode-sa
    namespace: graylog
---
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: graylog-runtime
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegedContainer: false
allowedCapabilities:
  - CHOWN
  - DAC_OVERRIDE
  - FOWNER
  - NET_BIND_SERVICE
  - SETGID
  - SETUID
defaultAddCapabilities: []
fsGroup:
  type: RunAsAny
readOnlyRootFilesystem: false
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: MustRunAs
seccompProfiles:
  - runtime/default
supplementalGroups:
  type: RunAsAny
volumes:
  - configMap
  - downwardAPI
  - emptyDir
  - persistentVolumeClaim
  - projected
  - secret
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ocp-lab-use-scc-mongodb-operator-runtime
rules:
  - apiGroups:
      - security.openshift.io
    resourceNames:
      - mongodb-operator-runtime
    resources:
      - securitycontextconstraints
    verbs:
      - use
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mongodb-operator-runtime-scc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ocp-lab-use-scc-mongodb-operator-runtime
subjects:
  - kind: ServiceAccount
    name: mongodb-kubernetes-operator
    namespace: operators
  - kind: ServiceAccount
    name: mongodb-kubernetes-appdb
    namespace: operators
  - kind: ServiceAccount
    name: mongodb-kubernetes-database-pods
    namespace: operators
---
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: mongodb-operator-runtime
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegedContainer: false
allowedCapabilities:
  - CHOWN
  - DAC_OVERRIDE
  - FOWNER
  - SETGID
  - SETUID
defaultAddCapabilities: []
fsGroup:
  type: RunAsAny
readOnlyRootFilesystem: false
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: MustRunAs
seccompProfiles:
  - runtime/default
supplementalGroups:
  type: RunAsAny
volumes:
  - configMap
  - downwardAPI
  - emptyDir
  - persistentVolumeClaim
  - projected
  - secret
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: graylog
  namespace: graylog
spec:
  to:
    kind: Service
    name: graylog-svc
    weight: 100
  port:
    targetPort: 9000
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
apiVersion: v1
kind: Service
metadata:
  name: graylog-tcp-input
  namespace: graylog
spec:
  type: ClusterIP
  selector:
    app: graylog-app
    app.kubernetes.io/instance: graylog
    app.kubernetes.io/name: graylog
  ports:
    - name: raw-tcp
      port: 5555
      targetPort: 5555
      protocol: TCP
