apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kubeshark-enterprise-license
  namespace: kubeshark
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-fields
    kind: ClusterSecretStore
  target:
    name: kubeshark-secret-default
    creationPolicy: Merge
    deletionPolicy: Retain
  data:
  - secretKey: LICENSE
    remoteRef:
      key: ocp-lab/kubeshark
      property: LICENSE
