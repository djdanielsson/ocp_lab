apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sso-user
  namespace: sso
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: bitwarden-sso
    kind: ClusterSecretStore
  target:
    name: sso-user
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: username
    remoteRef:
      key: sso
      property: username
  - secretKey: password
    remoteRef:
      key: sso
      property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sso-admin
  namespace: sso
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
spec:
  refreshPolicy: CreatedOnce
  target:
    name: sso-admin
    creationPolicy: Orphan
    deletionPolicy: Retain
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: admin-password
    rewrite:
    - regexp:
        source: password
        target: password
---
