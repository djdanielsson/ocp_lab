apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: sso
spec:
  selector:
    app: keycloak
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: sso
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
      containers:
      - name: keycloak
        image: registry.redhat.io/rhbk/keycloak-rhel9:26.6@sha256:b55a3fdf5c836cca9d6b754dd27adbd8de28a27ca46e7d205ceb6c0d7ae35ab9
        args:
        - start
        env:
        - name: KC_DB
          value: postgres
        - name: KC_DB_URL_HOST
          value: sso-postgres
        - name: KC_DB_URL_DATABASE
          value: keycloak
        - name: KC_DB_USERNAME
          value: keycloak
        - name: KC_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sso-db
              key: password
        - name: KC_BOOTSTRAP_ADMIN_USERNAME
          value: bootstrap-admin
        - name: KC_BOOTSTRAP_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sso-admin
              key: password
        - name: KC_HOSTNAME
          value: https://sso.apps.ocp.lab.danielsson.us.com
        - name: KC_HTTP_ENABLED
          value: 'true'
        - name: KC_PROXY_HEADERS
          value: xforwarded
        - name: KC_HEALTH_ENABLED
          value: 'true'
        - name: KC_CACHE
          value: local
        ports:
        - name: http
          containerPort: 8080
        - name: management
          containerPort: 9000
        startupProbe:
          httpGet:
            path: /health/started
            port: management
          periodSeconds: 5
          failureThreshold: 120
        readinessProbe:
          httpGet:
            path: /health/ready
            port: management
        livenessProbe:
          httpGet:
            path: /health/live
            port: management
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            memory: 2Gi
