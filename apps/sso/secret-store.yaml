apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: bitwarden-sso
spec:
  conditions:
  - namespaces:
    - sso
  provider:
    webhook:
      url: http://bitwarden-cli.external-secrets.svc.cluster.local:8087/list/object/items?search=sso
      result:
        jsonPath: $.data.data[?@.name=="sso"].login.{{ .remoteRef.property }}
      headers:
        Content-Type: application/json
