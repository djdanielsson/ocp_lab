---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: automation-orchestrator-admin-password
  namespace: automation-orchestrator
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: bitwarden-login
    kind: ClusterSecretStore
  target:
    name: automation-orchestrator-admin-password
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        password: "{{ .password }}"
  data:
    - secretKey: password
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: ClusterSecretStore
      remoteRef:
        key: ocp-lab/automation-orchestrator-admin
        property: password
