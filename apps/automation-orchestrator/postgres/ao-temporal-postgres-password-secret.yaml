---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ao-temporal-postgres-password
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: bitwarden-login
    kind: ClusterSecretStore
  target:
    name: ao-temporal-postgres-password
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        username: temporal
        password: "{{ .password }}"
  data:
    - secretKey: password
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: ClusterSecretStore
      remoteRef:
        key: ocp-lab/postgres-temporal
        property: password
